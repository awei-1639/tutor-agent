server:
  port: 8180   # 8080 被本机其他服务占用

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: personal-ai-tutor
  mvc:
    # 将 DispatcherServlet 初始化移到启动阶段，避免首个画像请求承担冷启动延迟。
    servlet:
      load-on-startup: 1
  servlet:
    multipart:
      # 文档上传采用“传输上限”和“解析预算”分离；默认 50 MB，避免大文档被过早拒绝。
      max-file-size: ${KNOWLEDGE_UPLOAD_MAX_FILE_SIZE:50MB}
      max-request-size: ${KNOWLEDGE_UPLOAD_MAX_REQUEST_SIZE:55MB}
  datasource:
    url: jdbc:postgresql://localhost:5432/tutor
    username: tutor
    password: ${POSTGRES_PASSWORD:tutor_dev_only}
  flyway:
    enabled: true

tutor:
  routing:
    out-of-scope-threshold: ${ROUTING_OUT_OF_SCOPE_THRESHOLD:0.92}
    # 低置信度路由先走单跳，避免不确定建议放大为昂贵的多跳检索。
    multi-hop-confidence-threshold: ${ROUTING_MULTI_HOP_CONFIDENCE_THRESHOLD:0.70}
    # 中等置信度且存在竞争意图时先向用户澄清，避免无依据地扇出专家。
    clarification-confidence-threshold: ${ROUTING_CLARIFICATION_CONFIDENCE_THRESHOLD:0.80}
    # 主意图与第二意图分数过近时视为不确定，禁止多跳。
    intent-margin-threshold: ${ROUTING_INTENT_MARGIN_THRESHOLD:0.15}
    calibration:
      enabled: ${ROUTING_CALIBRATION_ENABLED:false}
      model-path: ${ROUTING_CALIBRATION_MODEL_PATH:}
  chat:
    rate-limit-per-minute: ${CHAT_RATE_LIMIT_PER_MINUTE:20}
    tool-loop-enabled: ${CHAT_TOOL_LOOP_ENABLED:false}
    turn:
      poll-ms: ${CHAT_TURN_POLL_MS:1000}
      lease-renew-ms: ${CHAT_TURN_LEASE_RENEW_MS:30000}
  retrieval:
    profile:
      version: ${RETRIEVAL_PROFILE_VERSION:2026-08-baseline}
      vector-top-n: ${RETRIEVAL_VECTOR_TOP_N:20}
      rerank-pool: ${RETRIEVAL_RERANK_POOL:12}
      expand-source-n: ${RETRIEVAL_EXPAND_SOURCE_N:10}
      dense-expand-source-n: ${RETRIEVAL_DENSE_EXPAND_SOURCE_N:8}
      sparse-expand-source-n: ${RETRIEVAL_SPARSE_EXPAND_SOURCE_N:4}
      expand-per-source: ${RETRIEVAL_EXPAND_PER_SOURCE:6}
      expand-limit: ${RETRIEVAL_EXPAND_LIMIT:40}
      rrf-k: ${RETRIEVAL_RRF_K:10}
      graph-alpha: ${RETRIEVAL_GRAPH_ALPHA:0.85}
      sparse-beta: ${RETRIEVAL_SPARSE_BETA:0.30}
      non-resource-dampen: ${RETRIEVAL_NON_RESOURCE_DAMPEN:0.40}
      # 非资源型查询对资源节点的对称降权; 1.0=关闭。q003坏例(技能型查询被资源切片挤出top5)
      # 的候选修复, 经检索评测确认收益后收紧默认值。
      resource-dampen: ${RETRIEVAL_RESOURCE_DAMPEN:1.0}
      sparse-threshold: ${RETRIEVAL_SPARSE_THRESHOLD:0.15}
    channel-floor:
      # 在检索评测集证明保留各通道的最低候选数量能提升召回、且不降低精度前，
      # 保持关闭。
      enabled: ${RETRIEVAL_CHANNEL_FLOOR_ENABLED:false}
  interview:
    open-rate-limit-per-hour: ${INTERVIEW_OPEN_RATE_LIMIT_PER_HOUR:5}
    answer-rate-limit-per-minute: ${INTERVIEW_ANSWER_RATE_LIMIT_PER_MINUTE:30}
    completion:
      poll-ms: ${INTERVIEW_COMPLETION_POLL_MS:500}
  auth:
    # 本地演示便利入口；生产 profile 会强制关闭。
    dev-login-enabled: ${DEV_LOGIN_ENABLED:false}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:}
  internal:
    # evals 使用的检索/路由/手动推送端点；生产 profile 会强制关闭。
    enabled: ${INTERNAL_ENDPOINTS_ENABLED:false}
    # 即便显式启用，也只接受本机评测工具的请求；远程调用应通过受保护的管理 API。
    loopback-only: ${INTERNAL_ENDPOINTS_LOOPBACK_ONLY:true}
  eval:
    # 从项目根目录启动后默认读取真实评测集；容器/部署环境可通过环境变量覆盖。
    dataset-path: ${RAG_EVAL_DATASET_PATH:evals/rag_testset.json}
    # 发布门禁：P0 先保证执行可靠，P1 约束核心检索质量；采样评测仅用于诊断，不具备发布资格。
    gate:
      min-overall-hit: ${RAG_EVAL_MIN_OVERALL_HIT:0.70}
      min-overall-recall: ${RAG_EVAL_MIN_OVERALL_RECALL:0.40}
      min-multi-hop-hit: ${RAG_EVAL_MIN_MULTI_HOP_HIT:0.50}
      max-errors: ${RAG_EVAL_MAX_ERRORS:0}

oss:
  enabled: ${OSS_ENABLED:false}
  endpoint: ${OSS_ENDPOINT:}
  region: ${OSS_REGION:}
  bucket: ${OSS_BUCKET:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  prefix: ${OSS_PREFIX:knowledge-documents/}

security:
  # 简历原文与PII映射的对称加密密钥 (pgcrypto pgp_sym_encrypt); 缺失时拒绝上传
  resume-enc-key: ${RESUME_ENC_KEY:}
  # 当前密钥版本；轮换期间同时配置旧密钥与旧版本，后台会逐步重加密 Episode。
  resume-enc-key-id: ${RESUME_ENC_KEY_ID:v1}
  resume-enc-previous-key: ${RESUME_ENC_PREVIOUS_KEY:}
  resume-enc-previous-key-id: ${RESUME_ENC_PREVIOUS_KEY_ID:}

memory:
  facts:
    enabled: ${MEMORY_FACTS_ENABLED:true}
    max-per-extraction: ${MEMORY_FACTS_MAX_PER_EXTRACTION:8}
    max-active-per-user: ${MEMORY_FACTS_MAX_ACTIVE_PER_USER:60}
    recall-top-k: ${MEMORY_FACTS_RECALL_TOP_K:6}
  recall:
    recency-decay-days: ${MEMORY_RECALL_RECENCY_DECAY_DAYS:30}
  sync:
    lease-seconds: ${MEMORY_SYNC_LEASE_SECONDS:300}
    retry-limit-per-minute: ${MEMORY_SYNC_RETRY_LIMIT_PER_MINUTE:3}
    metrics-refresh-ms: ${MEMORY_SYNC_METRICS_REFRESH_MS:10000}
  episode:
    min-new-messages: ${MEMORY_EPISODE_MIN_NEW_MESSAGES:12}
    importance-gate-enabled: ${MEMORY_EPISODE_IMPORTANCE_GATE_ENABLED:true}
  mem0:
    enabled: ${MEM0_ENABLED:false}
    base-url: ${MEM0_BASE_URL:https://api.mem0.ai}
    api-key: ${MEM0_API_KEY:}
    timeout-seconds: ${MEM0_TIMEOUT_SECONDS:2}
    failure-threshold: ${MEM0_FAILURE_THRESHOLD:3}
    open-seconds: ${MEM0_OPEN_SECONDS:30}

knowledge:
  ocr:
    aliyun:
      enabled: ${ALIYUN_OCR_ENABLED:false}
      region: ${ALIYUN_OCR_REGION:cn-hangzhou}
      access-key-id: ${ALIYUN_OCR_ACCESS_KEY_ID:}
      access-key-secret: ${ALIYUN_OCR_ACCESS_KEY_SECRET:}
      text-density-threshold: ${ALIYUN_OCR_TEXT_DENSITY_THRESHOLD:80}
      max-pages: ${ALIYUN_OCR_MAX_PAGES:100}
      timeout-seconds: ${ALIYUN_OCR_TIMEOUT_SECONDS:15}
  scan:
    enabled: ${KNOWLEDGE_SCAN_ENABLED:false}
    host: ${CLAMAV_HOST:}
    port: ${CLAMAV_PORT:3310}
    timeout-seconds: ${CLAMAV_TIMEOUT_SECONDS:5}
  upload:
    max-per-hour: ${KNOWLEDGE_UPLOAD_MAX_PER_HOUR:20}
    max-file-size: ${KNOWLEDGE_UPLOAD_MAX_FILE_SIZE:50MB}
    max-request-size: ${KNOWLEDGE_UPLOAD_MAX_REQUEST_SIZE:55MB}
    multipart-threshold: ${KNOWLEDGE_MULTIPART_THRESHOLD:8MB}
    multipart-part-size: ${KNOWLEDGE_MULTIPART_PART_SIZE:8MB}
    session-ttl: ${KNOWLEDGE_UPLOAD_SESSION_TTL:24h}
  ingestion:
    poll-ms: ${KNOWLEDGE_INGESTION_POLL_MS:1000}
    lease-seconds: ${KNOWLEDGE_INGESTION_LEASE_SECONDS:1800}
    max-in-flight: ${KNOWLEDGE_INGESTION_MAX_IN_FLIGHT:4}
    embedding-concurrency: ${KNOWLEDGE_EMBEDDING_CONCURRENCY:8}
    max-pending-jobs: ${KNOWLEDGE_INGESTION_MAX_PENDING_JOBS:1000}

push:
  cron: "0 0 8,20 * * *"       # 每日两次 (V3 6.2)
  match-threshold: 0.65
  cold-coverage-threshold: 0.5  # 无简历时按覆盖率判定 (冷启动规则)
  release-batch: 5              # Mock注水池每次释放条数
  max-per-run: 5

plan:
  generation:
    poll-ms: ${PLAN_GENERATION_POLL_MS:500}

neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: ${NEO4J_PASSWORD:tutor_dev_only}
  resilience:
    query-timeout-seconds: ${NEO4J_QUERY_TIMEOUT_SECONDS:2}
    failure-threshold: ${NEO4J_FAILURE_THRESHOLD:3}
    open-seconds: ${NEO4J_OPEN_SECONDS:30}

llm:
  # purpose→model 映射 (实现设计 6.4 模型分级路由), 配置化可整体切换
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  siliconflow:
    api-key: ${SILICONFLOW_API_KEY:}
    base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
  routing:
    chat: deepseek-chat
    router: deepseek-chat        # 轻任务候选: 切至更廉价模型后跑评估回归
    expert: deepseek-chat
    summary: deepseek-chat
    extract: deepseek-chat
    judge: deepseek-chat
    plan: deepseek-chat
    embed: BAAI/bge-m3
  # 主供应商全部尝试失败后的备用出口，默认关闭 (保持单供应商行为)。
  # 仅承接非流式结构化调用 (router/expert/judge/extract/plan)；流式聊天已发出的
  # token 无法撤回，不在此切换范围内。备用端点须为 OpenAI 兼容接口。
  fallback:
    enabled: ${LLM_FALLBACK_ENABLED:false}
    endpoint:
      api-key: ${LLM_FALLBACK_API_KEY:}
      base-url: ${LLM_FALLBACK_BASE_URL:https://api.siliconflow.cn/v1}
    routing:
      chat: ${LLM_FALLBACK_MODEL_CHAT:deepseek-ai/DeepSeek-V3}
      router: ${LLM_FALLBACK_MODEL_ROUTER:deepseek-ai/DeepSeek-V3}
      expert: ${LLM_FALLBACK_MODEL_EXPERT:deepseek-ai/DeepSeek-V3}
      summary: ${LLM_FALLBACK_MODEL_SUMMARY:deepseek-ai/DeepSeek-V3}
      extract: ${LLM_FALLBACK_MODEL_EXTRACT:deepseek-ai/DeepSeek-V3}
      judge: ${LLM_FALLBACK_MODEL_JUDGE:deepseek-ai/DeepSeek-V3}
      plan: ${LLM_FALLBACK_MODEL_PLAN:deepseek-ai/DeepSeek-V3}
  budget:
    daily-token-limit: 2000000   # 每日限额 (网关执行, 实现设计 6.1)
    turn-token-limit: 50000      # 单轮熔断
    user-daily-token-limit: ${LLM_USER_DAILY_TOKEN_LIMIT:300000}  # 每用户每日限额 (trace 归属后生效)
    background-share-percent: ${LLM_BACKGROUND_SHARE_PERCENT:20}  # 后台任务 (摘要/抽取/批量嵌入) 日子预算占比
  timeout:
    router-seconds: 10
    chat-seconds: 60
    summary-seconds: 120
    expert-seconds: 25
  tokens:
    router:
      input-tokens: 1200
      # 96 会截断输出: JSON 骨架 (枚举字段 + 引号) 已占约 70 token，剩下不够写完
      # reason_codes 里的中文理由，JSON 在第 288 列断在字符串中间 (见 Badcase 07)。
      output-tokens: 160
    chat:
      input-tokens: 8000
      output-tokens: 1600
    expert:
      input-tokens: 5000
      output-tokens: 1800
    summary:
      input-tokens: 5000
      output-tokens: 600
    extract:
      input-tokens: 8000
      output-tokens: 1600
    judge:
      input-tokens: 3500
      output-tokens: 600
    plan:
      input-tokens: 6000
      output-tokens: 1800
    embed-input-tokens: 8000
    rerank-input-tokens: 6000
  concurrency:
    max-in-flight: ${LLM_MAX_IN_FLIGHT:16}
