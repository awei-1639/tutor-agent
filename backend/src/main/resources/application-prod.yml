# 生产环境必须显式提供所有敏感配置；缺失任意变量时应用启动失败。
spring:
  datasource:
    password: ${POSTGRES_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

neo4j:
  password: ${NEO4J_PASSWORD}
  resilience:
    query-timeout-seconds: ${NEO4J_QUERY_TIMEOUT_SECONDS:2}
    failure-threshold: ${NEO4J_FAILURE_THRESHOLD:3}
    open-seconds: ${NEO4J_OPEN_SECONDS:30}

security:
  resume-enc-key: ${RESUME_ENC_KEY}
  resume-enc-key-id: ${RESUME_ENC_KEY_ID:v1}
  resume-enc-previous-key: ${RESUME_ENC_PREVIOUS_KEY:}
  resume-enc-previous-key-id: ${RESUME_ENC_PREVIOUS_KEY_ID:}

memory:
  sync:
    lease-seconds: ${MEMORY_SYNC_LEASE_SECONDS:300}
    retry-limit-per-minute: ${MEMORY_SYNC_RETRY_LIMIT_PER_MINUTE:3}
    metrics-refresh-ms: ${MEMORY_SYNC_METRICS_REFRESH_MS:10000}
  episode:
    min-new-messages: ${MEMORY_EPISODE_MIN_NEW_MESSAGES:12}
  mem0:
    enabled: ${MEM0_ENABLED:false}
    base-url: ${MEM0_BASE_URL:https://api.mem0.ai}
    api-key: ${MEM0_API_KEY:}
    timeout-seconds: ${MEM0_TIMEOUT_SECONDS:2}
    failure-threshold: ${MEM0_FAILURE_THRESHOLD:3}
    open-seconds: ${MEM0_OPEN_SECONDS:30}

tutor:
  chat:
    rate-limit-per-minute: ${CHAT_RATE_LIMIT_PER_MINUTE:10}
    tool-loop-enabled: ${CHAT_TOOL_LOOP_ENABLED:false}
    turn:
      poll-ms: ${CHAT_TURN_POLL_MS:1000}
      lease-renew-ms: ${CHAT_TURN_LEASE_RENEW_MS:30000}
  auth:
    dev-login-enabled: false
    cookie-secure: true
  internal:
    enabled: false
    loopback-only: true
  jwt:
    secret: ${JWT_SECRET}

llm:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY}
  siliconflow:
    api-key: ${SILICONFLOW_API_KEY}
  concurrency:
    max-in-flight: ${LLM_MAX_IN_FLIGHT:16}
