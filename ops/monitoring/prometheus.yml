# Prometheus 抓取配置 — 由 docker-compose.monitoring.yml 挂载。
# 后端目标: 后端无论跑在宿主 (java -jar) 还是容器 (docker-compose.local 的 backend
# 服务都把 8180 发布到宿主), 经 host.docker.internal:8180 均可达 (extra_hosts 映射)。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tutor-backend
    metrics_path: /actuator/prometheus
    # 抓取令牌: 与后端 TUTOR_METRICS_SCRAPE_TOKEN 保持一致 (见 scrape-token 挂载文件)
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape-token
    static_configs:
      - targets:
          - host.docker.internal:8180
