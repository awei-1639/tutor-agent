<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">一次聊天请求时序</title><desc id="desc">浏览器、ChatController、ChatService、Retriever、LLM 和 PostgreSQL 的同步与异步时序。</desc><defs><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526783"/></marker></defs><rect width="1200" height="760" fill="#f5f7fb"/><text x="50" y="52" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#172033">一次聊天请求 · 时序图</text><g font-family="system-ui,sans-serif" font-size="14" text-anchor="middle"><g font-weight="700" fill="#172033"><text x="115" y="102">Browser</text><text x="315" y="102">Controller</text><text x="515" y="102">ChatService</text><text x="715" y="102">Retriever / LLM</text><text x="930" y="102">PostgreSQL</text><text x="1100" y="102">Async</text></g><g stroke="#b7c4d4" stroke-dasharray="5 5"><path d="M115 118v570"/><path d="M315 118v570"/><path d="M515 118v570"/><path d="M715 118v570"/><path d="M930 118v570"/><path d="M1100 118v570"/></g></g><rect x="55" y="130" width="1085" height="345" rx="18" fill="#eaf1ff" fill-opacity=".55" stroke="#8bb2ff" stroke-dasharray="8 6"/><text x="75" y="158" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">同步主路径：用户等待</text><g fill="none" stroke="#526783" stroke-width="2" marker-end="url(#arrow2)"><path d="M115 195h400"/><path d="M515 240h200"/><path d="M515 285h415"/><path d="M715 330H515"/><path d="M515 375H115"/><path d="M115 420h200"/></g><g font-family="system-ui,sans-serif" font-size="13" fill="#405374"><text x="135" y="188">POST /chat + Idempotency-Key</text><text x="535" y="233">route → retrieve → generate</text><text x="535" y="278">INSERT message / turn result</text><text x="535" y="323">SSE token / citation</text><text x="135" y="368">done(messageId, citationStatus)</text><text x="335" y="413">return durable answer</text></g><rect x="55" y="505" width="1085" height="155" rx="18" fill="#e7f8f5" fill-opacity=".7" stroke="#9bdace" stroke-dasharray="8 6"/><text x="75" y="533" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#0f766e">异步后处理：用户不等待，但任务可恢复</text><g fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow2)"><path d="M515 570h585"/><path d="M515 610h585"/><path d="M515 650h585"/></g><g font-family="system-ui,sans-serif" font-size="13" fill="#405374"><text x="535" y="563">profile update / domain extraction</text><text x="535" y="603">episode summary / memory outbox</text><text x="535" y="643">citation verification / trace persistence</text></g><rect x="55" y="695" width="1085" height="34" rx="10" fill="#fff0ee" stroke="#f3c3bd"/><text x="75" y="717" font-family="system-ui,sans-serif" font-size="13" fill="#b42318">断线、超时或取消：CancellationToken 向下游传播，已完成的持久化边界不被重复提交。</text></svg>
