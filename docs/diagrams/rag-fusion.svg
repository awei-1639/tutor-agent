<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">混合 RAG 与多跳检索</title><desc id="desc">Dense、Sparse、Graph 三通道融合为证据，多跳使用 Judge 控制并且按跳数衰减。</desc><defs><marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526783"/></marker></defs><rect width="1200" height="650" fill="#f5f7fb"/><text x="55" y="55" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#172033">混合 RAG · 证据融合与多跳控制</text><g font-family="system-ui,sans-serif" font-size="15" text-anchor="middle"><rect x="55" y="125" width="205" height="95" rx="18" fill="#eaf1ff" stroke="#8bb2ff"/><text x="157" y="163" font-weight="700" fill="#1d4ed8">Dense</text><text x="157" y="190" fill="#405374">Embedding → pgvector</text><rect x="55" y="270" width="205" height="95" rx="18" fill="#e7f8f5" stroke="#9bdace"/><text x="157" y="308" font-weight="700" fill="#0f766e">Sparse</text><text x="157" y="335" fill="#405374">pg_trgm → rare terms</text><rect x="55" y="415" width="205" height="95" rx="18" fill="#f1eaff" stroke="#c8adff"/><text x="157" y="453" font-weight="700" fill="#5b21b6">Graph</text><text x="157" y="480" fill="#405374">Neo4j → relation path</text><rect x="380" y="235" width="230" height="145" rx="22" fill="#fff4df" stroke="#f0c577"/><text x="495" y="278" font-weight="700" fill="#92400e">RRF Fusion</text><text x="495" y="307" fill="#536782">K = 10</text><text x="495" y="334" fill="#536782">dedupe · scope · score</text><text x="495" y="361" fill="#536782">α = 0.85 for graph</text><rect x="730" y="235" width="220" height="145" rx="22" fill="#172033"/><text x="840" y="278" font-weight="700" fill="#fff">Top-K Evidence</text><text x="840" y="307" fill="#dce7ff">S1…SN</text><text x="840" y="334" fill="#dce7ff">source · hash · path</text><text x="840" y="361" fill="#dce7ff">ready for Prompt</text><rect x="1010" y="235" width="135" height="145" rx="22" fill="#e7f8f5" stroke="#9bdace"/><text x="1077" y="278" font-weight="700" fill="#0f766e">Rerank</text><text x="1077" y="307" fill="#536782">resource</text><text x="1077" y="334" fill="#536782">only</text><g fill="none" stroke="#526783" stroke-width="2.5" marker-end="url(#arrow3)"><path d="M260 172l120 105"/><path d="M260 317h120"/><path d="M260 462L380 350"/><path d="M610 307h120"/><path d="M950 307h60"/></g></g><rect x="380" y="475" width="765" height="105" rx="18" fill="#fff" stroke="#dbe3ee"/><text x="405" y="510" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#172033">Agentic 多跳控制</text><text x="405" y="538" font-family="system-ui,sans-serif" font-size="14" fill="#536782">Hop 1：Query 检索 → Hop 2：Query + Graph Frontier → Hop 3：上限停止</text><text x="405" y="563" font-family="system-ui,sans-serif" font-size="14" fill="#536782">权重：1.00 → 0.60 → 0.36；Judge 失败/非法 JSON → 保留已有证据并停止</text></svg>
