# 监控栈 overlay: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d prometheus grafana
# 抓取令牌: 后端与 Prometheus 各读一份同值令牌 (TUTOR_METRICS_SCRAPE_TOKEN, 见 .env.example);
# compose 把 ops/monitoring/scrape-token 挂进 Prometheus 的 credentials_file。
services:
  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./ops/monitoring/scrape-token:/etc/prometheus/scrape-token:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
