name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Enforce immutable Flyway migrations on pull requests
        if: github.event_name == 'pull_request'
        run: bash scripts/check-flyway-migration-immutability.sh "${{ github.event.pull_request.base.sha }}"
      - name: Enforce immutable Flyway migrations on pushes
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: bash scripts/check-flyway-migration-immutability.sh "${{ github.event.before }}"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests and coverage report
        working-directory: backend
        run: mvn -B verify
      - name: Public interview scoring regression gate
        working-directory: backend
        run: mvn -B -Dtest=InterviewScoringQualityTest,InterviewModelEvalQualityTest,InterviewLlmServiceTest test
      - name: Prepare protected interview score gold set
        id: interview_score_gold
        env:
          SCORE_GOLD_JSON_B64: ${{ secrets.INTERVIEW_SCORE_GOLD_JSON_B64 }}
        run: |
          if [ -z "$SCORE_GOLD_JSON_B64" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Protected interview score gate is not configured; no real gold set was supplied."
            exit 0
          fi
          mkdir -p evals/private
          printf '%s' "$SCORE_GOLD_JSON_B64" | base64 --decode > evals/private/interview-score-gold.json
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Protected interview score release gate
        if: steps.interview_score_gold.outputs.enabled == 'true'
        working-directory: backend
        run: mvn -B -Dtest=InterviewScoreEvalGateTest -DinterviewScoreGoldPath="$GITHUB_WORKSPACE/evals/private/interview-score-gold.json" test
      - name: Remove protected interview score gold set
        if: always()
        run: rm -f evals/private/interview-score-gold.json
      - name: PostgreSQL, Neo4j, and Flyway integration tests
        working-directory: backend
        run: mvn -B test -DrunIntegrationTests=true -Dtest='*IT'
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check and production build
        working-directory: frontend
        run: npm run lint:types && npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend security E2E
        working-directory: frontend
        run: npm run e2e
      - name: Upload frontend test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-test-reports
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: warn

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build backend image
        run: docker build --tag personal-ai-tutor-backend:ci ./backend
      - name: Build frontend image
        run: docker build --tag personal-ai-tutor-frontend:ci ./frontend
      - name: Validate production Compose contract
        run: docker compose -f docker-compose.prod.yml config --quiet

  frontend-real-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start isolated full stack
        env:
          POSTGRES_PASSWORD: e2e-postgres-password
          NEO4J_PASSWORD: e2e-neo4j-password
          JWT_SECRET: e2e-jwt-secret-must-be-at-least-32-characters
          RESUME_ENC_KEY: e2e-resume-encryption-key
          DEEPSEEK_API_KEY: e2e-no-external-llm-calls
          SILICONFLOW_API_KEY: e2e-no-external-llm-calls
        run: docker compose -p tutor-e2e -f docker-compose.prod.yml -f docker-compose.e2e.yml up --build --wait
      - name: Browser smoke test against real stack
        working-directory: frontend
        env:
          REAL_STACK_E2E: 'true'
          E2E_BASE_URL: http://127.0.0.1:8081
        run: npx playwright test e2e/real-stack.spec.ts
      - name: Collect full-stack logs
        if: always()
        run: docker compose -p tutor-e2e -f docker-compose.prod.yml -f docker-compose.e2e.yml logs --no-color
      - name: Stop isolated full stack
        if: always()
        run: docker compose -p tutor-e2e -f docker-compose.prod.yml -f docker-compose.e2e.yml down --volumes
