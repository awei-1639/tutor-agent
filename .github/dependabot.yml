version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Spring Boot 4 是大版本迁移（Jakarta/依赖树/native 兼容），#75 CI 失败关闭时结论。
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      # Neo4j driver 6 为 major 断代（API 变更 + CI 失败），#69 关闭时结论。
      - dependency-name: "org.neo4j.driver:neo4j-java-driver"
        update-types: ["version-update:semver-major"]
      # springdoc 3 依赖 Spring Boot 4 系，与 SB4 升级窗口绑定，#74 关闭时结论。
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # React 19 是 major 迁移（@types 破坏 + 13 页面适配 + e2e 回归），需专门排期，
      # 评论式 ignore 对本仓库不生效（#14 被忽略后 dependabot 又开了 #44/#51）。
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # Tailwind v4 配置模型重写（CSS-first、postcss 插件更换），#17 关闭时结论。
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 是 Go 原生重写，属工具链迁移而非 bump，#16 关闭时结论。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
