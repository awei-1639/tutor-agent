# 本地全栈容器演练覆盖文件：先用 Dockerfile 构建 :local 镜像，再与基础依赖一起启动。
services:
  backend:
    image: personal-ai-tutor-backend:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tutor
      SPRING_DATASOURCE_USERNAME: tutor
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tutor_dev_only}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-tutor_dev_only}
      JWT_SECRET: ${JWT_SECRET}
      RESUME_ENC_KEY: ${RESUME_ENC_KEY}
      DEV_LOGIN_ENABLED: "true"
      AUTH_COOKIE_SECURE: "false"
      OSS_ENABLED: "false"
      MEM0_ENABLED: "false"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-container-validation}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-container-validation}
    ports:
      - "${TUTOR_BACKEND_PORT:-8180}:8180"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    image: personal-ai-tutor-frontend:local
    ports:
      - "${TUTOR_FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_started
